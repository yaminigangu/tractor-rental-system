<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  
  <!-- App Title & Description -->
  <title>Agrirent | Farm Machinery Rental Platform</title>
  <meta name="description"
    content="Connecting farmers and tractor owners for ploughing, rotavating, cultivating, corn harvesting, straw baling, and trailer agricultural services." />

  <!-- Progressive Web App (PWA) Manifest & Icons -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512.png" />

  <!-- Mobile Web App & Theme Color (Android / Chrome) -->
  <meta name="theme-color" content="#1b5e20" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="AgriRent" />

  <!-- Apple iOS Web App Configurations -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AgriRent" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512.png" />

  <!-- Open Graph Meta Tags (WhatsApp & Social Sharing) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="AgriRent - Village Tractor & Machinery Rental Web App" />
  <meta property="og:description" content="Instant tractor and agricultural machine booking for Telangana farmers and equipment owners." />
  <meta property="og:image" content="/pwa-512.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
